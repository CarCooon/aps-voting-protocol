[project]
name = "aps-voting-protocol"
version = "1.0.0"
description = "Implementazione simulata e misura delle prestazioni di un protocollo di voto elettronico verificabile"
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
